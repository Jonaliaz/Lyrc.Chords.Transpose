<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pruebas Unitarias - ChordTransposer</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #0f172a; color: #f8fafc; }
    .pass { color: #4ade80; margin: 0.25rem 0; }
    .fail { color: #f87171; margin: 0.25rem 0; font-weight: bold; }
    h1 { color: #60a5fa; }
    #summary { margin-top: 1.5rem; font-size: 1.2rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Suite de Pruebas Unitarias: ChordTransposer</h1>
  <div id="results"></div>
  <div id="summary"></div>

  <script src="../js/chord-transposer.js"></script>
  <script src="../js/projects.js"></script>
  <script src="../js/tempo-companion.js"></script>
  <script>
    const results = document.getElementById('results');
    let totalTests = 0;
    let passedTests = 0;

    function assert(description, actual, expected) {
      totalTests++;
      const isPass = actual === expected;
      if (isPass) {
        passedTests++;
        const p = document.createElement('div');
        p.className = 'pass';
        p.textContent = `✔ [PASS] ${description}: '${actual}'`;
        results.appendChild(p);
      } else {
        const p = document.createElement('div');
        p.className = 'fail';
        p.textContent = `✖ [FAIL] ${description} | Esperado: '${expected}', Obtenido: '${actual}'`;
        results.appendChild(p);
      }
    }

    console.log("Iniciando pruebas...");

    // 1. Transposición de notas individuales
    assert("C + 1 semitono (#)", ChordTransposer.transposeNote("C", 1, { preferSharps: true }), "C#");
    assert("C + 1 semitono (b)", ChordTransposer.transposeNote("C", 1, { preferSharps: false }), "Db");
    assert("B + 1 semitono", ChordTransposer.transposeNote("B", 1, { preferSharps: true }), "C");
    assert("E + 1 semitono", ChordTransposer.transposeNote("E", 1, { preferSharps: true }), "F");
    assert("C - 1 semitono", ChordTransposer.transposeNote("C", -1, { preferSharps: true }), "B");
    assert("G + 2 semitonos", ChordTransposer.transposeNote("G", 2, { preferSharps: true }), "A");

    // 2. Acordes complejos y extensiones
    assert("Am + 2 semitonos", ChordTransposer.transposeChord("Am", 2, { preferSharps: true }), "Bm");
    assert("Cmaj7 + 1 semitono", ChordTransposer.transposeChord("Cmaj7", 1, { preferSharps: true }), "C#maj7");
    assert("F#m7b5 + 1 semitono", ChordTransposer.transposeChord("F#m7b5", 1, { preferSharps: true }), "Gm7b5");
    assert("Dsus4 - 2 semitonos", ChordTransposer.transposeChord("Dsus4", -2, { preferSharps: true }), "Csus4");

    // 3. Slash chords (bajos invertidos)
    assert("G/B + 2 semitonos", ChordTransposer.transposeChord("G/B", 2, { preferSharps: true }), "A/C#");
    assert("C/E + 1 semitono", ChordTransposer.transposeChord("C/E", 1, { preferSharps: true }), "C#/F");

    // 4. Notación Latina (Do, Re, Mi)
    assert("Do + 2 semitonos (Latino)", ChordTransposer.transposeChord("Do", 2, { targetNotation: 'latin' }), "Re");
    assert("Lam + 2 semitonos (Latino)", ChordTransposer.transposeChord("Lam", 2, { targetNotation: 'latin' }), "Sim");
    assert("Sol/Si + 2 semitonos (Latino)", ChordTransposer.transposeChord("Sol/Si", 2, { targetNotation: 'latin', preferSharps: true }), "La/Do#");

    // 5. Conversión entre sistemas
    assert("Convertir C a Latino", ChordTransposer.convertChordNotation("C", "latin"), "Do");
    assert("Convertir Do a Anglosajón", ChordTransposer.convertChordNotation("Do", "english"), "C");
    assert("Convertir Fa#m7 a Anglosajón", ChordTransposer.convertChordNotation("Fa#m7", "english"), "F#m7");

    // 6. Transposición de texto completo [ChordPro]
    const testText = "[Bm]Ella dur[G]mió al ca[D]lor de las ma[A]sas";
    const transposedText = ChordTransposer.transposeText(testText, 2, { preferSharps: true });
    assert("Transponer línea completa +2 semitonos", transposedText, "[C#m]Ella dur[A]mió al ca[E]lor de las ma[B]sas");

    // 7. Fusión de dos líneas clásicas a ChordPro
    const chordsLine = "C         Am";
    const lyricsLine = "De música ligera";
    const merged = ChordTransposer.injectChordsIntoLyrics(chordsLine, lyricsLine);
    assert("Inyección de acordes en línea de letra", merged, "[C]De música [Am]ligera");

    // 8. Fusión de líneas con corchetes existentes sin duplicar
    const bracketChordsLine = "[C]       [Am]";
    const mergedBrackets = ChordTransposer.injectChordsIntoLyrics(bracketChordsLine, lyricsLine);
    assert("Inyección de acordes entre corchetes sin duplicación", mergedBrackets, "[C]De música [Am]ligera");

    // 9. Detección automática de dos líneas en parseSong
    const twoLineSong = "Bm          G\nElla durmió al calor de las masas";
    const parsedTwoLine = ChordTransposer.parseSong(twoLineSong);
    assert("parseSong fusiona automáticamente acordes arriba de letra", parsedTwoLine.length, 1);
    assert("Tipo de línea fusionada es lyric-line", parsedTwoLine[0].type, "lyric-line");
    assert("Primer acorde fusionado es Bm", parsedTwoLine[0].segments[0].chord, "Bm");

    // 10. Reconocimiento de secciones ampliadas
    const sectionTest = ChordTransposer.parseSong("[Estrofa 1]\n[Chorus]");
    assert("Reconocimiento de sección [Estrofa 1]", sectionTest[0].type, "section");
    assert("Reconocimiento de sección [Chorus]", sectionTest[1].type, "section");

    // 11. Detección correcta de líneas de letras sin acordes (no deben convertirse a acordes)
    const lyricLineTest = ChordTransposer.parseSong("Cuando canto esta canción de amor\ny me siento muy feliz");
    assert("Línea 1 de letra es lyric-line", lyricLineTest[0].type, "lyric-line");
    assert("Línea 1 no tiene acorde falso", lyricLineTest[0].segments[0].chord, null);
    assert("Línea 1 conserva la letra exacta", lyricLineTest[0].segments[0].lyric, "Cuando canto esta canción de amor");
    assert("Línea 2 de letra es lyric-line", lyricLineTest[1].type, "lyric-line");

    // 12. isValidChord no da falsos positivos con palabras del español
    assert("'amor' no es acorde", ChordTransposer.isValidChord("amor"), false);
    assert("'canto' no es acorde", ChordTransposer.isValidChord("canto"), false);
    assert("'esta' no es acorde", ChordTransposer.isValidChord("esta"), false);
    assert("'cancion' no es acorde", ChordTransposer.isValidChord("cancion"), false);
    assert("'De' no es acorde", ChordTransposer.isValidChord("De"), false);

    // 13. isValidChord valida correctamente acordes reales
    assert("'C#m7' es acorde válido", ChordTransposer.isValidChord("C#m7"), true);
    assert("'Fa#m7b5' es acorde válido", ChordTransposer.isValidChord("Fa#m7b5"), true);
    assert("'Sol/Si' es acorde válido", ChordTransposer.isValidChord("Sol/Si"), true);
    assert("'Am7/G' es acorde válido", ChordTransposer.isValidChord("Am7/G"), true);

    // 14. Pruebas Unitarias de ProjectsManager
    if (typeof ProjectsManager !== 'undefined') {
      localStorage.clear();
      assert("ProjectsManager inicializa lista vacía", ProjectsManager.getAll().length, 0);

      // Guardar nuevo proyecto
      const p1 = ProjectsManager.save({
        title: "Canción Test 1",
        artist: "Artista Test",
        key: "G",
        capo: 2,
        semitones: 0,
        content: "{title: Canción Test 1}\n[G]Hola [C]Mundo"
      });

      assert("Proyecto guardado tiene ID", typeof p1.id, "string");
      assert("Proyecto guardado tiene título correcto", p1.title, "Canción Test 1");
      assert("getAll devuelve 1 proyecto", ProjectsManager.getAll().length, 1);
      assert("getById encuentra el proyecto", ProjectsManager.getById(p1.id).title, "Canción Test 1");

      // Actualizar proyecto
      const p1Updated = ProjectsManager.save({
        id: p1.id,
        title: "Canción Test 1 Modificada",
        content: "{title: Canción Test 1 Modificada}\n[G]Hola [C]Mundo [D]Fin"
      });
      assert("Proyecto actualizado conserva ID", p1Updated.id, p1.id);
      assert("Proyecto actualizado tiene nuevo título", ProjectsManager.getById(p1.id).title, "Canción Test 1 Modificada");
      assert("Total de proyectos sigue siendo 1", ProjectsManager.getAll().length, 1);

      // Duplicar proyecto
      const copy = ProjectsManager.duplicate(p1.id);
      assert("Proyecto duplicado existe", copy !== null, true);
      assert("Proyecto duplicado tiene título con (Copia)", copy.title, "Canción Test 1 Modificada (Copia)");
      assert("Total de proyectos ahora es 2", ProjectsManager.getAll().length, 2);

      // Eliminar proyecto
      const deleted = ProjectsManager.deleteProject(p1.id);
      assert("Eliminar proyecto devuelve true", deleted, true);
      assert("Total de proyectos tras eliminar es 1", ProjectsManager.getAll().length, 1);
      assert("Proyecto eliminado ya no se encuentra", ProjectsManager.getById(p1.id), null);

      // Importar JSON
      const backupJson = JSON.stringify({
        projects: [
          { title: "Importada 1", artist: "Banda", key: "A", content: "[A]Letra" },
          { title: "Importada 2", artist: "Solista", key: "D", content: "[D]Letra" }
        ]
      });
      const importRes = ProjectsManager.importFromJson(backupJson);
      assert("Importación reporta 2 proyectos importados", importRes.imported, 2);
      assert("Total de proyectos tras importar es 3", ProjectsManager.getAll().length, 3);
    }

    // 15. Pruebas Unitarias de TempoCompanion (Acompañamiento y Metrónomo)
    if (typeof TempoCompanion !== 'undefined') {
      assert("TempoCompanion está definido", typeof TempoCompanion, "object");
      assert("TempoCompanion tiene método init", typeof TempoCompanion.init, "function");
      assert("TempoCompanion tiene método start", typeof TempoCompanion.start, "function");
      assert("TempoCompanion tiene método pause", typeof TempoCompanion.pause, "function");
      assert("TempoCompanion tiene método stop", typeof TempoCompanion.stop, "function");

      // Ajustes de BPM
      TempoCompanion.setBpm(120);
      assert("Ajuste de BPM a 120", TempoCompanion.getState().bpm, 120);

      TempoCompanion.setBpm(15); // límite inferior 30
      assert("BPM mínimo limitado a 30", TempoCompanion.getState().bpm, 30);

      TempoCompanion.setBpm(450); // límite superior 300
      assert("BPM máximo limitado a 300", TempoCompanion.getState().bpm, 300);

      // Compás
      TempoCompanion.setTimeSignature('3/4');
      assert("Compás 3/4 asigna 3 pulsos por compás", TempoCompanion.getState().timeSignature, 3);

      TempoCompanion.setTimeSignature('4/4');
      assert("Compás 4/4 asigna 4 pulsos por compás", TempoCompanion.getState().timeSignature, 4);

      // Paso por acorde
      TempoCompanion.setBeatsPerChord('2');
      assert("Paso por acorde ajustado a 2", TempoCompanion.getState().beatsPerChord, 2);

      TempoCompanion.setBeatsPerChord('auto');
      assert("Paso por acorde ajustado a 'auto'", TempoCompanion.getState().beatsPerChord, 'auto');

      // 16. Pruebas de construcción de línea de tiempo guiada por acordes (Continuidad entre líneas y omisión de secciones)
      const mockSheetBody = document.createElement('div');
      
      // Línea 1 con acordes G y C
      const line1 = document.createElement('div');
      line1.className = 'song-line';
      
      // Par 1 (sin acorde al inicio: Intro)
      const p1 = document.createElement('div');
      p1.className = 'chord-lyric-pair';
      p1.innerHTML = '<span class="chord-badge empty-chord"></span><span class="lyric-text">Intro </span>';
      line1.appendChild(p1);

      // Par 2 (con acorde G)
      const p2 = document.createElement('div');
      p2.className = 'chord-lyric-pair';
      p2.innerHTML = '<span class="chord-badge">G</span><span class="lyric-text">quel amor de música li</span>';
      line1.appendChild(p2);

      // Par 3 (con acorde C al final de la línea 1)
      const p3 = document.createElement('div');
      p3.className = 'chord-lyric-pair';
      p3.innerHTML = '<span class="chord-badge">C</span><span class="lyric-text">gera </span>';
      line1.appendChild(p3);

      mockSheetBody.appendChild(line1);

      // Subtítulo de sección (debe ser ignorado por el tempo)
      const secHeader = document.createElement('div');
      secHeader.className = 'song-section-title';
      secHeader.textContent = 'Coro';
      mockSheetBody.appendChild(secHeader);

      // Línea 2 con letra previa y luego acorde Em
      const line2 = document.createElement('div');
      line2.className = 'song-line';

      // Par 4 (letra al inicio de línea 2 antes del acorde Em: debe asociarse al acorde C anterior)
      const p4 = document.createElement('div');
      p4.className = 'chord-lyric-pair';
      p4.innerHTML = '<span class="chord-badge empty-chord"></span><span class="lyric-text">nada nos li</span>';
      line2.appendChild(p4);

      // Par 5 (con acorde Em en línea 2)
      const p5 = document.createElement('div');
      p5.className = 'chord-lyric-pair';
      p5.innerHTML = '<span class="chord-badge">Em</span><span class="lyric-text">bra, nada más queda</span>';
      line2.appendChild(p5);

      mockSheetBody.appendChild(line2);

      TempoCompanion.init({ sheetBody: mockSheetBody });
      const timeline = TempoCompanion.buildTimeline();

      assert("Línea de tiempo tiene exactamente 3 pasos de acordes (G, C, Em)", timeline.length, 3);
      assert("Paso 1 es acorde G", timeline[0].chord, "G");
      assert("Paso 1 resalta hasta antes de C ('quel amor de música li')", timeline[0].lyric, "quel amor de música li");
      assert("Paso 1 dura 4 tiempos", timeline[0].beats, 4);

      assert("Paso 2 es acorde C", timeline[1].chord, "C");
      assert("Paso 2 abarca entre líneas desde C en línea 1 hasta antes de Em en línea 2 ('gera nada nos li')", timeline[1].lyric, "gera nada nos li");
      assert("Paso 2 abarca 2 líneas DOM", timeline[1].lineEls.length, 2);

      assert("Paso 3 es acorde Em", timeline[2].chord, "Em");
      assert("Paso 3 resalta desde Em hasta el final de línea 2 ('bra, nada más queda')", timeline[2].lyric, "bra, nada más queda");

      // Estado de parada
      TempoCompanion.stop();
      assert("TempoCompanion en estado detenido tiene isPlaying false", TempoCompanion.getState().isPlaying, false);
      assert("TempoCompanion en estado detenido tiene currentLineIndex -1", TempoCompanion.getState().currentLineIndex, -1);
    }

    const summary = document.getElementById('summary');
    summary.textContent = `Resultado: ${passedTests} de ${totalTests} pruebas pasadas con éxito.`;
    summary.style.color = (passedTests === totalTests) ? '#4ade80' : '#f87171';
    
    // Indicador global para scripts automatizados
    window.testResults = { total: totalTests, passed: passedTests, success: passedTests === totalTests };
  </script>
</body>
</html>
